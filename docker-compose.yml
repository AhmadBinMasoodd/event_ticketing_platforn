services:
  redis:
    image: redis:7-alpine
    container_name: event-ticketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: event-ticketing-backend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
    name: event-ticketing-redis-data

networks:
  app-network:
    driver: bridge
    name: event-ticketing-network
